name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: python -m takomo_api.export_schema --check
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - name: generated types up to date
        run: npm run gen:types && git diff --exit-code src/types/fit-state.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
