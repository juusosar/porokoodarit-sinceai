name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: python -m takomo_api.export_schema --check
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - name: generated types up to date
        run: npm run gen:types && git diff --exit-code src/types/fit-state.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: build api image
        run: docker build -t takomo-api:ci api
      - name: build web image
        run: docker build -f web/Dockerfile -t takomo-web:ci .
      - name: smoke test
        run: |
          docker run -d --name api -p 8080:8080 takomo-api:ci
          docker run -d --name web -p 3000:8080 -e VITE_API_URL=http://localhost:8080 takomo-web:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/health
          curl -fsS localhost:3000/ | grep -q '<div id="root">'
          curl -fsS localhost:3000/env.js | grep -q 'http://localhost:8080'
          curl -fsS localhost:3000/some/deep/route | grep -q '<div id="root">'
      - name: container logs
        if: failure()
        run: docker logs api; docker logs web

  history:
    # Rebase-merge keeps every PR commit on main, so PR commits must be clean.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no merge commits, no leftover fixup!/squash!
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          merges=$(git log --merges --oneline "$BASE..$HEAD")
          fixups=$(git log --format='%h %s' "$BASE..$HEAD" | grep -E '^[0-9a-f]+ (fixup|squash|amend)! ' || true)
          if [ -n "$merges" ]; then echo "::error::Merge commits in PR, rebase onto base instead:"; echo "$merges"; fi
          if [ -n "$fixups" ]; then echo "::error::Run 'git rebase -i --autosquash origin/<base>' first:"; echo "$fixups"; fi
          [ -z "$merges$fixups" ]
