[project]
name = "takomo-api"
version = "0.1.0"
description = "Takomo Fitter API: fitting engine, evidence fusion and LLM explanation proxy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "google-genai>=1.30",
  "httpx>=0.27",  # TTS provider calls (voice module)
  # swing analysis (main's Python, takomo_api/swing/upstream)
  "numpy>=1.26",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
eval = ["pandas>=2,<3", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["takomo_api*"]

[tool.setuptools.package-data]
takomo_api = ["data/*.json", "prompts/*.md", "swing/upstream/UPSTREAM"]

[tool.ruff]
line-length = 120
target-version = "py311"
# verbatim copy of main's code (app/vision/sync-main.sh): not reformatted here
extend-exclude = ["takomo_api/swing/upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"takomo_api/engine/rules.py" = ["E501"]  # ported lab code, kept close to source
